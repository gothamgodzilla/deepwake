[toolchain]
anchor_version = "1.2.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
deepwake = "BdpbXkD8MrKDvtgifnAFx2cPHXma3TZFzEeHV2wSEHkD"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

# Legacy `solana-test-validator` path (`anchor test --validator legacy`).
# The Metaplex token-metadata program is not built into the local validator.
[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"

# Default `anchor test` validator is Surfpool. Online mode pulls the
# token-metadata program from mainnet the first time `initialize_mint` runs.
[surfpool]
online = true
datasource_rpc_url = "https://api.mainnet-beta.solana.com"
